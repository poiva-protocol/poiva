[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poiva-sdk"
version = "0.1.0"
description = "Python client for the Poiva protocol API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["poiva", "protocol", "sdk", "work-execution"]
dependencies = []

[project.urls]
Repository = "https://github.com/vladutbutnaru/poiva-protocol"

[tool.setuptools.packages.find]
include = ["poiva*"]
