  /api/cloud/workspace/missions/{missionId}/share:
    post:
      tags: [Verification Links]
      operationId: createShare
      summary: Create (or replace) a public verification link for a mission.
      parameters:
        - name: missionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Share link created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareResponse" }
    get:
      tags: [Verification Links]
      operationId: currentShare
      summary: Get the current share link for a mission, if any.
      parameters:
        - name: missionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current share link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareResponse" }
    delete:
      tags: [Verification Links]
      operationId: revokeShare
      summary: Revoke a mission's share link.
      parameters:
        - name: missionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Share link revoked.

  /api/public/verify/{token}:
    get:
      tags: [Verification Links]
      operationId: publicVerify
      summary: >
        Fetch the verification timeline behind a share link. Unauthenticated: possession of the
        token is the credential. Recompute `fingerprint` independently to confirm the returned
        timeline matches the source record.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationTimelineResponse" }
        "404":
          description: Unknown or revoked token.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Session token returned by /api/cloud/login or /api/cloud/signup, sent as
        `Authorization: Bearer <token>`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Organization API key of the form `pk_live_<keyId>.<secret>`. Also accepted on the
        `X-Poiva-Api-Key` header.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    SignupRequest:
      type: object
      required: [organizationName, email, password]
      properties:
        organizationName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }

    MemberResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string }

    OrganizationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        memberCount: { type: integer }
        members:
          type: array
          items: { $ref: "#/components/schemas/MemberResponse" }

    AuthResponse:
      type: object
      properties:
        organization: { $ref: "#/components/schemas/OrganizationResponse" }
        user: { $ref: "#/components/schemas/MemberResponse" }
        tokenType: { type: string, example: Bearer }
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }

    CurrentAccountResponse:
      type: object
      properties:
        organization: { $ref: "#/components/schemas/OrganizationResponse" }
        user: { $ref: "#/components/schemas/MemberResponse" }
        expiresAt: { type: string, format: date-time }

    MissionCreateRequest:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]

    MissionStateUpdateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: "schema/common.schema.json#/$defs/missionState" }

    ActivityCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }

    ActivityStateUpdateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: "schema/common.schema.json#/$defs/activityState" }

    ActivityAssignRequest:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
          description: Omit to assign the caller's own (auto-provisioned) participant.

    DeliverableCreateRequest:
      type: object
      required: [title, artifactType]
      properties:
        title: { type: string, minLength: 1 }
        artifactType: { type: string, minLength: 1 }
        activityId: { type: string, format: uuid }
        acceptanceCriteria:
          type: array
          items: { type: string }

    DeliverableStateUpdateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: "schema/common.schema.json#/$defs/deliverableState" }

    EvidenceCreateRequest:
      type: object
      required: [type, locator]
      properties:
        type: { type: string, minLength: 1 }
        locator: { type: string, minLength: 1 }

    VerificationCreateRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "schema/common.schema.json#/$defs/verificationMode" }
        policyCode: { type: string }

    VerificationOutcomeUpdateRequest:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: "schema/common.schema.json#/$defs/verificationOutcome" }

    VerificationEvaluateRequest:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: "schema/common.schema.json#/$defs/verificationOutcome" }
        notes: { type: string }

    SettlementCreateRequest:
      type: object
      required: [type]
      properties:
        type: { $ref: "schema/common.schema.json#/$defs/settlementType" }
        amount: { type: number }
        currency: { type: string }

    SettlementStateUpdateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: "schema/common.schema.json#/$defs/settlementState" }

    ParticipantCreateRequest:
      type: object
      required: [displayName, kind]
      properties:
        displayName: { type: string, minLength: 1 }
        kind: { $ref: "schema/common.schema.json#/$defs/participantKind" }
        externalRef: { type: string }
        trustScore: { type: number }

    ParticipantAttachCapabilityRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1 }

    CapabilityCreateRequest:
      type: object
      required: [code, display]
      properties:
        code: { type: string, minLength: 1 }
        display: { type: string, minLength: 1 }
        description: { type: string }

    KnowledgeCapsuleCreateRequest:
      type: object
      required: [title, type, locator]
      properties:
        title: { type: string, minLength: 1 }
        type: { $ref: "schema/common.schema.json#/$defs/knowledgeType" }
        locator: { type: string, minLength: 1 }
        version: { type: integer }

    EstimateCreateRequest:
      type: object
      properties:
        activityId: { type: string, format: uuid }
        planningProposalId: { type: string, format: uuid }
        durationMinutes: { type: integer }
        effortHours: { type: number }
        cost: { type: number }
        currency: { type: string }
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        requiredCapabilityCodes:
          type: array
          items: { type: string }
        risks:
          type: array
          items: { type: string }

    PlanningProposalCreateRequest:
      type: object
      properties:
        strategy: { type: string }
        expectedTimeline: { type: string, format: date-time }

    ArtifactCreateRequest:
      type: object
      required: [type, locator]
      properties:
        type: { type: string, minLength: 1 }
        locator: { type: string, minLength: 1 }
        checksum: { type: string }

    ObjectiveCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        priority: { $ref: "schema/common.schema.json#/$defs/priority" }
        targetMetric: { type: string }

    ObjectiveStateUpdateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: "schema/common.schema.json#/$defs/objectiveState" }

    ConstraintCreateRequest:
      type: object
      required: [type, description, severity]
      properties:
        type: { $ref: "schema/common.schema.json#/$defs/constraintType" }
        description: { type: string, minLength: 1 }
        severity: { $ref: "schema/common.schema.json#/$defs/constraintSeverity" }

    ConstraintStateUpdateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: "schema/common.schema.json#/$defs/constraintState" }

    PolicyCreateRequest:
      type: object
      required: [code, title, appliesTo, description]
      properties:
        code: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        appliesTo: { $ref: "schema/common.schema.json#/$defs/policyScope" }
        description: { type: string, minLength: 1 }

    PolicyStateUpdateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: "schema/common.schema.json#/$defs/policyState" }

    ShareResponse:
      type: object
      properties:
        token: { type: string }
        url: { type: string, format: uri }
        resourceType: { type: string }
        resourceId: { type: string }
        createdAt: { type: string, format: date-time }
        revoked: { type: boolean }

    VerificationStep:
      type: object
      properties:
        resourceType: { type: string }
        resourceId: { type: string }
        action: { type: string }
        title: { type: string }
        status: { type: string }
        summary: { type: string }
        occurredAt: { type: string, format: date-time }
        stepHash: { type: string }

    VerificationTimelineResponse:
      type: object
      properties:
        organizationName: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        title: { type: string }
        summary: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/VerificationStep" }
        fingerprint:
          type: string
          description: Recompute independently to confirm the timeline hasn't been altered.
        verifiedAt: { type: string, format: date-time }
        shareUrl: { type: string, format: uri }
